<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:#0a0a0a;color:#e0e0e0;padding:15px}
.container{max-width:1200px;margin:0 auto}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding:15px 20px;background:#141414;border-radius:10px;border:1px solid #2a2a2a}
.month-nav{display:flex;align-items:center;gap:15px}
.month-nav h1{font-size:22px;text-align:center;color:#fff;min-width:200px}
.nav-btn{background:#2a2a2a;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-size:16px}
.main-grid{display:grid;grid-template-columns:300px 1fr 280px;gap:15px}
.panel{background:#141414;border-radius:10px;border:1px solid #2a2a2a;padding:15px}
.panel h3{font-size:11px;color:#666;text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #2a2a2a}
.goal-item{display:grid;grid-template-columns:1fr auto 40px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #1e1e1e}
.goal-name{font-size:14px;color:#ddd;overflow:hidden;text-overflow:ellipsis}
.btn-group{display:flex;gap:4px}
.btn-sm{background:#1e1e1e;border:none;color:#888;width:26px;height:26px;border-radius:4px;cursor:pointer;font-size:12px}
.btn-sm:hover{color:#fff;background:#2a2a2a}
.today-dot{width:28px;height:28px;border-radius:50%;border:2px solid #333;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent}
.today-dot.done{background:#2a5aaa;border-color:#2a5aaa;color:#fff}
.add-btn{width:100%;padding:10px;margin-top:12px;background:#1e1e1e;color:#2a5aaa;border:1px solid #2a5aaa;border-radius:6px;cursor:pointer;font-size:13px}
.period-btn{flex:1;background:#1e1e1e;color:#888;border:none;padding:8px;border-radius:6px;cursor:pointer;font-size:12px}
.period-btn.active{background:#1a3a6e;color:#fff}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:4px;text-align:center;border:1px solid #1e1e1e;font-size:12px}
th{background:#1a1a1a;color:#888}
th.weekend{color:#e94560}
th.weekday{color:#2a5aaa}
td.habit-name{text-align:left;padding-left:10px;background:#141414;position:sticky;left:0;min-width:100px}
td.cell{cursor:pointer;font-size:16px}
td.cell:hover{background:#1e1e1e}
td.cell.done{color:#2a5aaa}
td.cell.completed{background:#1a2a1a}
td.cell.completed div{width:10px;height:10px;background:#4ade80;border-radius:2px;margin:0 auto}
td.cell.inactive{background:#0d0d0d;cursor:default}
.circle-wrap{position:relative;width:180px;height:180px;margin:0 auto}
.circle-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.circle-center .num{font-size:28px;font-weight:bold}
.circle-center .txt{font-size:11px;color:#666}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;align-items:center;justify-content:center}
.modal.active{display:flex}
.modal-box{background:#141414;border:1px solid #2a2a2a;border-radius:10px;padding:20px;max-width:400px;width:90%}
.modal-box h2{margin-bottom:15px;color:#fff}
.modal-box label{display:block;margin:10px 0 5px;color:#888;font-size:12px}
.modal-box input,.modal-box select{width:100%;padding:8px;background:#1e1e1e;border:1px solid #2a2a2a;color:#fff;border-radius:5px}
.modal-btns{display:flex;gap:8px;margin-top:15px}
.modal-btns button{flex:1;padding:10px;border:none;border-radius:5px;cursor:pointer}
.btn-cancel{background:#2a2a2a;color:#fff}
.btn-ok{background:#2a5aaa;color:#fff}
.btn-danger{background:#e94560;color:#fff}
@media(max-width:900px){.main-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<div class="header">
<div class="month-nav">
<button class="nav-btn" onclick="changeMonth(-1)">◀</button>
<h1 id="monthTitle">Ноябрь 2026</h1>
<button class="nav-btn" onclick="changeMonth(1)">▶</button>
</div>
</div>
<div class="main-grid">
<div class="panel">
<h3>Цели &nbsp;&nbsp;&nbsp;&nbsp; Сегодня</h3>
<div id="goalsList"></div>
<button class="add-btn" onclick="openGoalModal()">+ Добавить цель</button>
</div>
<div style="display:flex;flex-direction:column;gap:15px">
<div class="panel" style="height:300px">
<h3>Активность</h3>
<div style="display:flex;gap:5px;margin-bottom:10px">
    <button class="period-btn active" onclick="setWavePeriod('month')">Месяц</button>
    <button class="period-btn" onclick="setWavePeriod('year')">Год</button>
</div>
<canvas id="waveChart"></canvas>
</div>
<div class="panel" style="flex:1">
<h3>Трекер</h3>
<div class="table-wrap">
<table id="trackerTable"><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table>
</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:15px">
<div class="panel">
<h3>Общий прогресс</h3>
<div class="circle-wrap">
<canvas id="mainCircle"></canvas>
<div class="circle-center">
<div class="num" id="circlePercent">0%</div>
<div class="txt" id="circleText">0/0</div>
</div>
</div>
</div>
<div class="panel">
<h3>Время (неделя)</h3>
<div class="circle-wrap" style="height:140px;width:140px">
<canvas id="timeCircle"></canvas>
<div class="circle-center">
<div class="num" id="timeTotal" style="font-size:16px">0ч</div>
<div class="txt">за неделю</div>
</div>
</div>
<div id="timeLegend" style="margin-top:10px;font-size:11px"></div>
<div style="margin-top:10px;padding:10px;background:#1e1e1e;border-radius:6px;text-align:center">
<div style="font-size:11px;color:#888">🏆 Лучший день</div>
<div style="font-size:13px;color:#fbbf24" id="bestDay">-</div>
</div>
</div>
</div>
</div>
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div class="modal" id="goalModal">
<div class="modal-box">
<h2 id="goalModalTitle">Цель</h2>
<input type="hidden" id="goalId">
<label>Название</label><input type="text" id="goalName">
<label>Начало</label><input type="date" id="goalStart">
<label>Конец (необязательно)</label><input type="date" id="goalEnd">
<label>Цель в месяц</label><input type="number" id="goalTarget" value="30">
<div class="modal-btns">
<button class="btn-cancel" onclick="closeModal('goalModal')">Отмена</button>
<button class="btn-ok" onclick="saveGoal()">OK</button>
</div>
</div>
</div>

<div class="modal" id="timeModal">
<div class="modal-box">
<h2>Добавить время</h2>
<label>Цель</label><select id="timeGoal"></select>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
<div><label>Часы</label><input type="number" id="timeH" min="0" value="0"></div>
<div><label>Минуты</label><input type="number" id="timeM" min="0" max="59" value="0"></div>
</div>
<label>Дата</label><input type="date" id="timeDate">
<div class="modal-btns">
<button class="btn-cancel" onclick="closeModal('timeModal')">Отмена</button>
<button class="btn-ok" onclick="saveTime()">OK</button>
</div>
</div>
</div>

<div class="modal" id="completeModal">
<div class="modal-box">
<h2>Завершить цель?</h2>
<p style="color:#ddd;margin:15px 0">Период будет отмечен зелёным</p>
<input type="hidden" id="completeId">
<div class="modal-btns">
<button class="btn-cancel" onclick="closeModal('completeModal')">Нет</button>
<button class="btn-ok" onclick="confirmComplete()">Да</button>
</div>
</div>
</div>

<div class="modal" id="deleteModal">
<div class="modal-box">
<h2>Удалить?</h2>
<p style="color:#ddd;margin:15px 0">Все данные будут удалены</p>
<input type="hidden" id="deleteId">
<div class="modal-btns">
<button class="btn-cancel" onclick="closeModal('deleteModal')">Нет</button>
<button class="btn-danger" onclick="confirmDelete()">Да</button>
</div>
</div>
</div>

<script>
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const COLORS=['#2a5aaa','#e94560','#4ade80','#fbbf24','#a855f7','#06b6d4'];
const EMOJI=/[\u{1F300}-\u{1F6FF}\u{1F900}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu;
let currentDate=new Date();
let data=null;
let charts={};
let wavePeriod='month';

function loadData(){
const keys=['lifeTrackerV9','lifeTracker','trackerData'];
let saved=null;
for(let key of keys){const s=localStorage.getItem(key);if(s){saved=s;break}}
if(saved){
try{
const parsed=JSON.parse(saved);
if(!parsed.goals && parsed.habits){
parsed.goals=parsed.habits.map(h=>({id:h.id,name:(h.name||'').replace(EMOJI,'').trim(),startDate:'2026-10-01',endDate:null,status:'active',target:30}));
}
if(!parsed.goalLogs && parsed.habitLogs) parsed.goalLogs={...parsed.habitLogs};
if(!parsed.timeLogs) parsed.timeLogs={};
if(parsed.goals) parsed.goals=parsed.goals.map(g=>({...g,name:(g.name||'').replace(EMOJI,'').trim(),startDate:g.startDate||'2026-10-01',status:g.status||'active'}));
return parsed;
}catch(e){console.error(e)}
}
return{goals:[],goalLogs:{},timeLogs:{}};
}

function saveData(){localStorage.setItem('lifeTrackerV9',JSON.stringify(data))}

function init(){
if(!data) data=loadData();
const savedMonth=localStorage.getItem('currentMonth');
if(savedMonth){const p=savedMonth.split('-');currentDate=new Date(parseInt(p[0]),parseInt(p[1])-1)}
updateAll();
}

function changeMonth(delta){
currentDate.setMonth(currentDate.getMonth()+delta);
localStorage.setItem('currentMonth',currentDate.getFullYear()+'-'+(currentDate.getMonth()+1));
updateAll();
}

function openModal(id){document.getElementById(id).classList.add('active')}
function closeModal(id){document.getElementById(id).classList.remove('active')}

function setWavePeriod(period){
wavePeriod=period;
document.querySelectorAll('.period-btn').forEach((btn,i)=>{
if((period==='month'&&i===0)||(period==='year'&&i===1)){btn.classList.add('active')}
else{btn.classList.remove('active')}
});
renderCharts();
}

function renderGoals(){
const today=new Date();
let html='';
data.goals.forEach(goal=>{
const key=goal.id+'-'+today.getFullYear()+'-'+today.getMonth()+'-'+today.getDate();
const isDone=data.goalLogs[key];
html+='<div class="goal-item"><div class="goal-name" title="'+goal.name+'">'+goal.name+'</div><div class="btn-group"><button class="btn-sm" onclick="editGoal('+goal.id+')">✏️</button><button class="btn-sm" onclick="openTimeModal('+goal.id+')">⏱️</button><button class="btn-sm" onclick="requestComplete('+goal.id+')">✓</button><button class="btn-sm" onclick="requestDelete('+goal.id+')">🗑</button></div><div class="today-dot '+(isDone?'done':'')+'" onclick="toggleToday('+goal.id+')"></div></div>';
});
if(data.goals.length===0)html='<div style="color:#666;font-size:12px;padding:15px;text-align:center">Нет целей</div>';
document.getElementById('goalsList').innerHTML=html;
}

function toggleToday(id){
const t=new Date();
const key=id+'-'+t.getFullYear()+'-'+t.getMonth()+'-'+t.getDate();
data.goalLogs[key]=!data.goalLogs[key];
saveData();updateAll();
}

function openGoalModal(goalId){
document.getElementById('goalId').value=goalId||'';
document.getElementById('goalModalTitle').textContent=goalId?'Редактировать':'Новая цель';
if(goalId){
const g=data.goals.find(x=>x.id===goalId);
if(g){document.getElementById('goalName').value=g.name;document.getElementById('goalStart').value=g.startDate;document.getElementById('goalEnd').value=g.endDate||'';document.getElementById('goalTarget').value=g.target}
}else{
document.getElementById('goalName').value='';document.getElementById('goalStart').value=new Date().toISOString().split('T')[0];document.getElementById('goalEnd').value='';document.getElementById('goalTarget').value='30';
}
openModal('goalModal');
}

function editGoal(id){openGoalModal(id)}

function saveGoal(){
const id=document.getElementById('goalId').value;
const name=document.getElementById('goalName').value.trim();
const start=document.getElementById('goalStart').value;
const end=document.getElementById('goalEnd').value||null;
const target=parseInt(document.getElementById('goalTarget').value)||30;
if(!name||!start){alert('Заполни название и дату!');return}
if(id){const g=data.goals.find(x=>x.id==id);g.name=name;g.startDate=start;g.endDate=end;g.target=target}
else{data.goals.push({id:Date.now(),name:name,startDate:start,endDate:end,status:'active',target:target})}
saveData();closeModal('goalModal');updateAll();
}

function openTimeModal(goalId){
const sel=document.getElementById('timeGoal');
sel.innerHTML=data.goals.filter(g=>g.status==='active').map(g=>'<option value="'+g.id+'" '+(g.id===goalId?'selected':'')+'>'+g.name+'</option>').join('');
document.getElementById('timeH').value='0';document.getElementById('timeM').value='0';document.getElementById('timeDate').value=new Date().toISOString().split('T')[0];
openModal('timeModal');
}

function saveTime(){
const gid=parseInt(document.getElementById('timeGoal').value);
const h=parseInt(document.getElementById('timeH').value)||0;
const m=parseInt(document.getElementById('timeM').value)||0;
const date=document.getElementById('timeDate').value;
if(!gid||!date||(h===0&&m===0))return;
const mins=h*60+m;
const key=gid+'-'+date;
data.timeLogs[key]=(data.timeLogs[key]||0)+mins;
saveData();closeModal('timeModal');updateAll();
}

function requestComplete(id){document.getElementById('completeId').value=id;openModal('completeModal')}
function confirmComplete(){
const id=parseInt(document.getElementById('completeId').value);
const g=data.goals.find(x=>x.id===id);
if(g){g.status='completed';if(!g.endDate)g.endDate=new Date().toISOString().split('T')[0];saveData();updateAll()}
closeModal('completeModal');
}

function requestDelete(id){document.getElementById('deleteId').value=id;openModal('deleteModal')}
function confirmDelete(){
const id=parseInt(document.getElementById('deleteId').value);
data.goals=data.goals.filter(x=>x.id!==id);
for(let k in data.goalLogs)if(k.startsWith(id+'-'))delete data.goalLogs[k];
for(let k in data.timeLogs)if(k.startsWith(id+'-'))delete data.timeLogs[k];
saveData();updateAll();closeModal('deleteModal');
}

function renderTable(){
const year=currentDate.getFullYear();
const month=currentDate.getMonth();
const days=new Date(year,month+1,0).getDate();
document.getElementById('monthTitle').textContent=MONTHS[month]+' '+year;
const thead=document.getElementById('tableHead');
const tbody=document.getElementById('tableBody');
thead.innerHTML='';tbody.innerHTML='';
let tr1=document.createElement('tr');
let tr2=document.createElement('tr');
tr1.innerHTML='<th style="position:sticky;left:0;background:#141414"></th>';
tr2.innerHTML='<th style="position:sticky;left:0;background:#141414"></th>';
for(let d=1;d<=days;d++){
const dt=new Date(year,month,d);
const dayName=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][dt.getDay()];
const isWeekend=dt.getDay()===0||dt.getDay()===6;
const th1=document.createElement('th');th1.textContent=dayName;th1.className=isWeekend?'weekend':'weekday';tr1.appendChild(th1);
const th2=document.createElement('th');th2.textContent=d;tr2.appendChild(th2);
}
thead.appendChild(tr1);thead.appendChild(tr2);
data.goals.forEach(goal=>{
const tr=document.createElement('tr');
const tdName=document.createElement('td');tdName.className='habit-name';tdName.textContent=goal.status==='completed'?'✓ '+goal.name:goal.name;tr.appendChild(tdName);
for(let d=1;d<=days;d++){
const td=document.createElement('td');
const dateStr=year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
const isActive=dateStr>=goal.startDate&&(!goal.endDate||dateStr<=goal.endDate);
if(isActive){
if(goal.status==='completed'){td.className='cell completed';td.innerHTML='<div></div>'}
else{
td.className='cell';
const key=goal.id+'-'+year+'-'+month+'-'+d;
const done=data.goalLogs[key];
if(done){td.className+=' done';td.textContent='●'}else{td.textContent='○'}
td.onclick=()=>{data.goalLogs[key]=!data.goalLogs[key];saveData();updateAll()};
}
}else{td.className='cell inactive'}
tr.appendChild(td);
}
tbody.appendChild(tr);
});
}

function renderCharts(){
const year=currentDate.getFullYear();
const month=currentDate.getMonth();

if(wavePeriod==='month'){
const daysInMonth=new Date(year,month+1,0).getDate();
const dailyActivity=[],labels=[];
for(let d=1;d<=daysInMonth;d++){
let count=0;
data.goals.forEach(g=>{if(data.goalLogs[g.id+'-'+year+'-'+month+'-'+d])count++});
dailyActivity.push(count);labels.push(d);
}
if(charts.wave)charts.wave.destroy();
charts.wave=new Chart(document.getElementById('waveChart'),{
type:'line',
data:{labels:labels,datasets:[{label:'Активность',data:dailyActivity,borderColor:'#2a5aaa',backgroundColor:'rgba(42,90,170,0.2)',borderWidth:3,fill:true,tension:0.4,pointRadius:3,pointBackgroundColor:'#2a5aaa',pointHoverRadius:6}]},
options:{responsive:true,maintainAspectRatio:false,layout:{padding:{bottom:50,left:10,right:10,top:10}},scales:{y:{beginAtZero:true,min:0,max:Math.max(data.goals.length,1),ticks:{color:'#666',stepSize:1,font:{size:12}},grid:{color:'#1e1e1e'}},x:{ticks:{color:'#666',maxTicksLimit:15,font:{size:12},padding:15},grid:{display:false}}},plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#fff',bodyColor:'#2a5aaa',borderColor:'#2a2a2a',borderWidth:1}}}
});
}else if(wavePeriod==='year'){
const monthlyActivity=[],labels=[],bgColors=[];
const shortMonths=['Янв','Фев','Мар','Апр','Май','Июн','Июл','Авг','Сен','Окт','Ноя','Дек'];
const currentMonth=currentDate.getMonth();
for(let m=0;m<12;m++){
let count=0;
const daysInM=new Date(year,m+1,0).getDate();
for(let d=1;d<=daysInM;d++){data.goals.forEach(h=>{if(data.goalLogs[h.id+'-'+year+'-'+m+'-'+d])count++})}
monthlyActivity.push(count);labels.push(shortMonths[m]);
if(m===currentMonth)bgColors.push('#2a5aaa');
else if(m<currentMonth)bgColors.push('#1a3a6e');
else bgColors.push('#1e1e1e');
}
if(charts.wave)charts.wave.destroy();
charts.wave=new Chart(document.getElementById('waveChart'),{
type:'bar',
data:{labels:labels,datasets:[{label:'Отметок за месяц',data:monthlyActivity,backgroundColor:bgColors,borderColor:'#2a5aaa',borderWidth:1,borderRadius:4,barPercentage:0.6,categoryPercentage:0.8}]},
options:{responsive:true,maintainAspectRatio:false,layout:{padding:{bottom:50,left:10,right:10,top:10}},scales:{y:{beginAtZero:true,ticks:{color:'#666',stepSize:1,font:{size:12}},grid:{color:'#1e1e1e'}},x:{ticks:{color:'#888',font:{size:11},maxRotation:0,autoSkip:false,padding:15},grid:{display:false}}},plugins:{legend:{display:false},tooltip:{backgroundColor:'#1a1a1a',titleColor:'#fff',bodyColor:'#2a5aaa',borderColor:'#2a2a2a',borderWidth:1}}}
});
}

let total=0,done=0;
const days=new Date(year,month+1,0).getDate();
data.goals.forEach(g=>{
if(g.status!=='active')return;
let cnt=0;
for(let d=1;d<=days;d++){if(data.goalLogs[g.id+'-'+year+'-'+month+'-'+d])cnt++}
total+=g.target;done+=cnt;
});
if(charts.main)charts.main.destroy();
charts.main=new Chart(document.getElementById('mainCircle'),{type:'doughnut',data:{labels:['Done','Left'],datasets:[{data:total>0?[done,total-done]:[0,100],backgroundColor:total>0?['#2a5aaa','#2a2a2a']:['#1e1e1e'],borderWidth:0,cutout:'70%'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
document.getElementById('circlePercent').textContent=total>0?Math.round(done/total*100)+'%':'0%';
document.getElementById('circleText').textContent=done+'/'+total;

renderTimeChart();
}

function renderTimeChart(){
const today=new Date();
const dow=today.getDay();
const start=new Date(today);start.setDate(today.getDate()-(dow===0?6:dow-1));start.setHours(0,0,0,0);
const end=new Date(start);end.setDate(start.getDate()+6);end.setHours(23,59,59,999);
const startStr=start.toISOString().split('T')[0];
const endStr=end.toISOString().split('T')[0];
const times={};let totalMins=0;
for(let[key,mins]of Object.entries(data.timeLogs)){
const parts=key.split('-');
if(parts.length<4)continue;
const d=parts[1]+'-'+parts[2]+'-'+parts[3];
if(d>=startStr&&d<=endStr){times[parts[0]]=(times[parts[0]]||0)+mins;totalMins+=mins}
}
const labels=[],vals=[];
for(let[gid,mins]of Object.entries(times)){const g=data.goals.find(x=>x.id==gid);if(g){labels.push(g.name);vals.push(mins)}}
if(charts.time)charts.time.destroy();
charts.time=new Chart(document.getElementById('timeCircle'),{type:'doughnut',data:{labels:labels.length?labels:['None'],datasets:[{data:vals.length?vals:[100],backgroundColor:vals.length?COLORS.slice(0,labels.length):['#1e1e1e'],borderWidth:0,cutout:'65%'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
const h=Math.floor(totalMins/60);const m=totalMins%60;
document.getElementById('timeTotal').textContent=h+'ч '+m+'м';
let leg='';
labels.forEach((l,i)=>{const hh=Math.floor(vals[i]/60);const mm=vals[i]%60;leg+='<div style="display:flex;align-items:center;gap:6px;margin:4px 0"><div style="width:8px;height:8px;background:'+COLORS[i%COLORS.length]+';border-radius:2px"></div><span>'+l+': '+hh+'ч '+mm+'м</span></div>'});
document.getElementById('timeLegend').innerHTML=leg||'<div style="color:#666">Нет данных</div>';
renderBestDay();
}

function renderBestDay(){
const year=currentDate.getFullYear();
const month=String(currentDate.getMonth()+1).padStart(2,'0');
const prefix='-'+year+'-'+month+'-';
const dayMins={};let maxM=0,bestD=null;
for(let[key,mins]of Object.entries(data.timeLogs)){
if(key.includes(prefix)){const d=key.split(prefix)[1];dayMins[d]=(dayMins[d]||0)+mins;if(dayMins[d]>maxM){maxM=dayMins[d];bestD=d}}
}
if(bestD&&maxM>0){const h=Math.floor(maxM/60);const m=maxM%60;document.getElementById('bestDay').textContent=parseInt(bestD)+' '+MONTHS[currentDate.getMonth()]+' — '+h+'ч '+m+'м'}
else{document.getElementById('bestDay').textContent='-'}
}

function updateAll(){renderGoals();renderTable();renderCharts()}
init();
</script>
